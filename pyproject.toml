[project]
name = "agent-skills-dev-studio"
version = "0.1.0"
description = "Local single-user portal to author Microsoft Agent Skills and chat with an Azure OpenAI agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "agent-framework-core",
    "agent-framework-openai",
    "azure-identity",
    "python-dotenv",
    "aiohttp>=3.14.1",
    "babel",
    "tzdata",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 79

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
